[project]
name = "marseille-engine"
version = "0.1.0"
description = "Urban heat island & green routing API for Marseille"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.136.3",
    "geopandas>=1.1.3",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "osmnx>=2.1.0",
    "pandas>=3.0.3",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pyproj>=3.7.2",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.0",
    "rasterstats>=0.21.0",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "uvicorn[standard]>=0.49.0",
]
